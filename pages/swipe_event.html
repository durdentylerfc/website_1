<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="/favicon_io/favicon.ico" type="image/x-icon">
<title>Touch Swipe Detection</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin-top: 50px;
  }
  #swipeArea {
    width: 90%;
    height: 300px;
    margin: auto;
    background: #f0f0f0;
    border: 2px dashed #888;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    touch-action: none; /* Prevent default scrolling on swipe */
  }
</style>
</head>
<body>

<h2>Swipe in Any Direction</h2>
<div id="swipeArea">Swipe Here</div>
<p id="output">Waiting for swipe...</p>

<script>
(function() {
    const swipeArea = document.getElementById('swipeArea');
    const output = document.getElementById('output');

    let startX = 0, startY = 0, endX = 0, endY = 0;
    const minDistance = 50; // Minimum distance in px to qualify as a swipe

    // Touch start
    swipeArea.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) return; // Ignore multi-touch
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
    }, false);

    // Touch move (optional: track movement)
    swipeArea.addEventListener('touchmove', function(e) {
        if (e.touches.length > 1) return;
        endX = e.touches[0].clientX;
        endY = e.touches[0].clientY;
    }, false);

    // Touch end
    swipeArea.addEventListener('touchend', function() {
        const deltaX = endX - startX;
        const deltaY = endY - startY;

        if (Math.abs(deltaX) < minDistance && Math.abs(deltaY) < minDistance) {
            output.textContent = "Swipe too short";
            return;
        }

        if (Math.abs(deltaX) > Math.abs(deltaY)) {
            // Horizontal swipe
            output.textContent = deltaX > 0 ? "Swiped Right" : "Swiped Left";
        } else {
            // Vertical swipe
            output.textContent = deltaY > 0 ? "Swiped Down" : "Swiped Up";
        }
    }, false);

    // Prevent scrolling while swiping inside the area
    swipeArea.addEventListener('touchmove', function(e) {
        e.preventDefault();
    }, { passive: false });

})();
</script>

</body>
</html>
